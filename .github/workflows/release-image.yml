name: release image

# Build the container image and push it to GHCR when a GitHub Release is published
# (owner action), or on a manual dispatch. This gives a no-clone install:
#   docker run -p 127.0.0.1:8090:8090 -e PENDPOST_ALLOW_UNAUTHENTICATED=1 ghcr.io/pendpost/pendpost
# It reuses the repo Dockerfile (multi-stage: build the dashboard, run the
# zero-dependency server, bind 0.0.0.0 inside the container only). Tags: the
# release version and `latest`. Multi-arch (amd64 + arm64) so a plain `docker pull`
# works on Apple Silicon; QEMU only emulates the light runtime stage.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    if: github.repository == 'pendpost/pendpost'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          # On a release: a semver tag (1.0.0, 1.0, 1) plus `latest`. On dispatch:
          # the branch/sha tag. `latest` only moves on a published release.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
