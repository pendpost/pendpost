name: Dependabot auto-merge

# Self-merging for low-risk dependency updates.
#
# This repo is private on the GitHub Free plan, where branch rulesets and the
# native "auto-merge" feature are unavailable, so we cannot gate a merge on
# required checks the usual way. Instead we trigger from workflow_run AFTER the
# CI workflow finishes: the job only runs when CI concluded "success", so a
# green CI run is the gate - a bump that breaks the build is never merged.
# (workflow_run also runs with a full read-write GITHUB_TOKEN, unlike the
# read-only token dependabot gets on pull_request events.)
#
# Policy: minor/patch updates self-merge (grouped minor+patch PRs, and any
# singleton whose major is unchanged). Major bumps are left for human review;
# breaking majors are additionally blocked at source by dependabot ignore rules.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    # Only in the private source repo: the public mirror (pendpost/pendpost) accepts fork PRs
    # from strangers, so this job must never act there (security audit 2026-11).
    if: >-
      github.repository == 'pendpost/site' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Merge minor/patch dependabot updates that passed CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Bind the merge to the exact PR whose CI passed: its number comes from the
          # workflow_run (empty for a fork PR, which is never merged here), and it must be
          # dependabot's own PR, from this repo, at the very head SHA that passed CI. A lookup
          # by branch name returned fork PRs with the same branch name (security audit 2026-11).
          if [ -z "$PR_NUMBER" ]; then echo "no same-repo PR on this run"; exit 0; fi
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          num=$(echo "$pr" | jq -r '.number')
          title=$(echo "$pr" | jq -r '.title')
          author=$(echo "$pr" | jq -r '.user.login')
          head_repo=$(echo "$pr" | jq -r '.head.repo.full_name')
          head_sha=$(echo "$pr" | jq -r '.head.sha')
          state=$(echo "$pr" | jq -r '.state')
          if [ "$author" != "dependabot[bot]" ] || [ "$head_repo" != "$REPO" ] || [ "$head_sha" != "$HEAD_SHA" ] || [ "$state" != "open" ]; then
            echo "PR #$num is not dependabot's open same-repo PR at the CI head ($author, $head_repo, $head_sha) - not merging"
            exit 0
          fi
          echo "evaluating PR #$num: $title"

          merge=false
          # Grouped PRs are configured to contain only minor+patch updates.
          case "$title" in
            *"-dependencies group"*|*"actions group"*) merge=true ;;
          esac
          # Singleton "Bump <name> from <old> to <new>": merge if major unchanged.
          if [ "$merge" = false ]; then
            old=$(echo "$title" | sed -nE 's/.* from ([0-9]+)(\.[0-9]+)?.* to .*/\1/p')
            new=$(echo "$title" | sed -nE 's/.* from .* to ([0-9]+)(\.[0-9]+)?.*/\1/p')
            if [ -n "$old" ] && [ -n "$new" ] && [ "$old" = "$new" ]; then merge=true; fi
          fi

          if [ "$merge" = true ]; then
            echo "minor/patch update - merging #$num"
            gh pr merge "$num" --repo "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA"
          else
            echo "major or unrecognized bump - leaving #$num for human review"
          fi
